[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node2shell-radar"
version = "0.1.0"
description = "Desktop Node.js asset discovery and CVE-2026-111497 exposure triage"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1", "dnspython>=2.7,<3", "cryptography>=43,<52"]

[project.gui-scripts]
node2shell-radar = "radar.gui:main"

[project.scripts]
node2shell-radar-cli = "radar.cli:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["data/*.txt", "data/*.png", "data/*.svg", "data/*.ico"]
